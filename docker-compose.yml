# =============================================================================
# Payment Orchestrator — Docker Compose
# =============================================================================
# Starts three services:
#   1. postgres  — PostgreSQL 15 with schema auto-initialised
#   2. redis     — Redis 7 with persistence + memory limits
#   3. app       — Spring Boot payment orchestrator (optional)
#
# Quick start (infra only — run app via Maven/IDE):
#   docker-compose up -d postgres redis
#
# Full stack including app:
#   docker-compose up -d
#
# Stop & clean up:
#   docker-compose down        # stop containers, keep volumes
#   docker-compose down -v     # stop containers AND delete all volumes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary persistence layer
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rs-postgres
    environment:
      POSTGRES_DB: payment_orchestrator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Idempotency key store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2
    container_name: payment_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - payment-net

